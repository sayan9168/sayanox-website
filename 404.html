<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Sayanox</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="https://raw.githubusercontent.com/sayan9168/sayanox/main/assets/sayanox-logo-256.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0b0f1a; --text: #e5e7eb; --muted: #9ca3af; --accent: #6366f1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .box { max-width: 420px; }
    h1 {
      font-size: 4.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p { color: var(--muted); margin-bottom: 1.75rem; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>This page does not exist.<br />Return to the Sayanox language site.</p>
    <a href="/">← Back to Sayanox</a>
  </div>
</body>
